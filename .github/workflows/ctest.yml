name: Build project and run ctest

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  BUILD_TYPE: Release

jobs:
  linux:
    name: Build with ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - name: "GCC 14"
            container: gcc:14
          - name: "GCC 15"
            container: gcc:15
          - name: "Clang 20"
            container: silkeh/clang:20

    container:
      image: ${{ matrix.container }}

    steps:
    - uses: actions/checkout@v7

    - name: Install dependencies
      run: |
        apt-get update
        apt-get install -y --no-install-recommends --no-install-suggests cmake curl git libtool unzip pkg-config tar zip

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      env:
        VCPKG_BINARY_SOURCES: default,readwrite

    - name: Restore vcpkg cache
      uses: actions/cache/restore@v6
      with:
        path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
        key: vcpkg-${{matrix.container}}-${{runner.arch}}-${{ hashFiles('vcpkg.json') }}
        restore-keys: vcpkg-${{matrix.container}}-${{runner.arch}}-

    - name: Detect clang
      id: cc
      shell: bash
      run: |
        if cc --version 2>/dev/null | grep -qi clang; then
          echo "cxxflags=-stdlib=libc++" >> "$GITHUB_OUTPUT"
        fi

    - name: Configure CMake
      env:
        CXXFLAGS: ${{ steps.cc.outputs.cxxflags }}
      run: cmake -B ${GITHUB_WORKSPACE}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DCMAKE_TOOLCHAIN_FILE=${{env.VCPKG_ROOT}}/scripts/buildsystems/vcpkg.cmake

    - name: Build
      run: cmake --build ${GITHUB_WORKSPACE}/build --config ${{env.BUILD_TYPE}} --parallel $(nproc) --verbose

    - name: Test
      run: ctest --test-dir ${GITHUB_WORKSPACE}/build --build-config ${{env.BUILD_TYPE}} --verbose

    - name: Save vcpkg cache
      uses: actions/cache/save@v6
      with:
        path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
        key: vcpkg-${{matrix.container}}-${{runner.arch}}-${{ hashFiles('vcpkg.json') }}

  macos:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [macos-15, macos-15-intel]

    steps:
    - uses: actions/checkout@v7

    - name: Install dependencies
      run: brew install autoconf automake libtool

    - name: Set Intel macOS deployment target
      if: matrix.os == 'macos-15-intel'
      run: echo "MACOSX_DEPLOYMENT_TARGET=10.13" >> "$GITHUB_ENV"

    - name: Restore vcpkg cache
      uses: actions/cache/restore@v6
      with:
        path: ~/.cache/vcpkg/archives
        key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json') }}
        restore-keys: vcpkg-${{matrix.runner}}-${{runner.arch}}-

    - name: Set vcpkg toolchain
      run: echo "CMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" >> "$GITHUB_ENV"

    - name: Configure CMake
      run: cmake -B ${GITHUB_WORKSPACE}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

    - name: Build
      run: cmake --build ${GITHUB_WORKSPACE}/build --config ${{env.BUILD_TYPE}} --parallel $(sysctl -n hw.ncpu) --verbose

    - name: Test
      run: ctest --test-dir ${GITHUB_WORKSPACE}/build --build-config ${{env.BUILD_TYPE}} --verbose

    - name: Save vcpkg cache
      uses: actions/cache/save@v6
      with:
        path: ~/.cache/vcpkg/archives
        key: vcpkg-${{matrix.runner}}-${{runner.arch}}-${{ hashFiles('vcpkg.json') }}
